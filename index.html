<!DOCTYPE html>
<html>
<head>
    <title>My Information</title>
</head>
<body>

<h2>My Information</h2>

<input id="name" placeholder="Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="department" placeholder="Department"><br><br>
<textarea id="about" placeholder="About Me"></textarea><br><br>

<button onclick="saveInfo()">Save</button>
<button onclick="showInfo()">Show Saved Info</button>

<div id="result"></div>

<script>
function saveInfo() {
    let info = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        department: document.getElementById("department").value,
        about: document.getElementById("about").value
    };

    localStorage.setItem("myInfo", JSON.stringify(info));
    alert("Information Saved!");
}

function showInfo() {
    let info = JSON.parse(localStorage.getItem("myInfo"));

    if (info) {
        document.getElementById("result").innerHTML = `
            <h3>Saved Information</h3>
            Name: ${info.name}<br>
            Email: ${info.email}<br>
            Phone: ${info.phone}<br>
            Department: ${info.department}<br>
            About: ${info.about}
        `;
    } else {
        document.getElementById("result").innerHTML = "No information saved.";
    }
}
</script>

</body>
</html>
