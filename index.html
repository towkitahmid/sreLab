<!DOCTYPE html>
<html>
<head>
    <title>My Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 40px;
        }

        h1 {
            color: #6c5ce7;
        }

        hr {
            width: 100px;
            border: 0;
            border-top: 3px solid #6c5ce7;
            margin: 15px auto 25px;
        }

        .info {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        p {
            font-size: 16px;
        }

        .name {
            color: #0984e3;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Information</h1>

    <hr>

    <div class="info">
        <p class="name">Towki Tahmid</p>

        <p><b>Department:</b> Information and Communication Engineering</p>

        <p><b>University:</b> Bangladesh University of Professionals</p>

        <p><b>Batch:</b> 24</p>

        <p><b>Interest:</b> Web Development, Technology & Event Management</p>

        <p><b>Email:</b> example@email.com</p>
    </div>

</body>
</html>
